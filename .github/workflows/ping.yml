name: Ping Streamlit Apps

on:
  push:
    branches: [main]

  schedule:
    - cron: '0 * * * *'  # Every hour

  # Also allows you to trigger it manually from the GitHub Actions tab
  # (useful for testing or waking apps immediately).
  workflow_dispatch:

jobs:
  ping:
    name: Ping apps
    runs-on: ubuntu-latest

    # Needed so the workflow can commit back to the repo to stay active
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run pinger
        run: python ping_apps.py

      - name: Keep repo active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep repo active [skip ci]"
          git push
