name: Ping Streamlit Apps

on:
  push:
    branches: [main]

 schedule:
    #  Runs 4× per day (every 6 hours) as a reliability hedge against GitHub
    #  dropping or heavily delaying scheduled triggers under high load.
    #  Cron format: minute  hour  day-of-month  month  day-of-week
    - cron: '0 4 * * *'   # 04:00 UTC
    - cron: '0 10 * * *'  # 10:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
    - cron: '0 22 * * *'  # 22:00 UTC

  # Also allows you to trigger it manually from the GitHub Actions tab
  # (useful for testing or waking apps immediately).
  workflow_dispatch:

jobs:
  ping:
    name: Ping apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run pinger
        run: python ping_apps.py
